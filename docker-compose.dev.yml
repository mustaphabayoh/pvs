version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: verification
      MYSQL_USER: veruser
      MYSQL_PASSWORD: verpass
    ports:
      - '3306:3306'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/mysql

  node-backend:
    build:
      context: ./node-backend
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      NODE_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: veruser
      DATABASE_PASSWORD: verpass
      DATABASE_NAME: verification
      JWT_SECRET: replace-with-secure-secret
    ports:
      - '4000:4000'
    volumes:
      - ./node-backend:/app
      - /app/node_modules
    # use wait script to ensure MySQL is ready and migrations are applied before starting
    command: sh -c "node tools/wait-for-db.js && npm run dev"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - node-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://127.0.0.1:80 -o /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - '5173:80'
    environment:
      VITE_API_BASE: http://node-backend:4000

  adminer:
    image: adminer:latest
    depends_on:
      - db
    ports:
      - '8080:8080'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://127.0.0.1:8080 -o /dev/null || exit 1"]
    environment:
      ADMINER_DEFAULT_SERVER: db

  # one-shot migration runner - useful for CI / manual schema control
  migrations:
    build:
      context: ./node-backend
    depends_on:
      - db
    entrypoint: ["sh", "-c", "node tools/wait-for-db.js && npx sequelize-cli db:migrate"]
    environment:
      NODE_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: veruser
      DATABASE_PASSWORD: verpass
      DATABASE_NAME: verification
    restart: 'no'

volumes:
  db_data:

