apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-backend
  namespace: pvs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-backend
  template:
    metadata:
      labels:
        app: node-backend
    spec:
      containers:
        - name: node-backend
          image: your-registry/pvs-node-backend:latest
          env:
            - name: DATABASE_HOST
              value: mysql
            - name: DATABASE_USER
              value: veruser
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user-password
            - name: DATABASE_NAME
              value: verification
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pvs-secrets
                  key: jwt-secret
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: node-backend
  namespace: pvs
spec:
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: node-backend
  type: ClusterIP
